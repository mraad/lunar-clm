[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lunar-clm"
version = "0.1.0"
description = "A minimal lunar lander with CLM typed decisions and paired Laya benchmarks"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
small = ["mlx-embeddings==0.1.0", "mlx==0.32.2", "numpy>=2,<3"]
train = ["torch>=2.1"]

[project.scripts]
lunar-clm = "lunar_clm.cli:main"
lunar-clm-benchmark = "lunar_clm.benchmark:main"
lunar-clm-serve = "lunar_clm.serve:main"

[tool.hatch.build.targets.wheel]
packages = ["lunar_clm"]
